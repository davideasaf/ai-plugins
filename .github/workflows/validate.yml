name: Validate plugins

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON manifests
        run: |
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool plugins/engineering-weekly-newsletter/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/engineering-weekly-newsletter/.claude-plugin/plugin.json >/dev/null
      - name: Run validator tests
        run: |
          python3 -m unittest discover \
            -s plugins/engineering-weekly-newsletter/skills/engineering-weekly-newsletter/tests
      - name: Validate synthetic example
        run: |
          python3 \
            plugins/engineering-weekly-newsletter/skills/engineering-weekly-newsletter/scripts/validate_newsletter.py \
            plugins/engineering-weekly-newsletter/skills/engineering-weekly-newsletter/examples/expected-newsletter.md \
            --strict
